<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LinkedIn Optimizer</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:960px;margin:40px auto;padding:0 20px;line-height:1.5}
    textarea{width:100%;min-height:150px;margin:8px 0 16px;padding:12px;box-sizing:border-box}
    button{padding:10px 16px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    pre{background:#f5f5f5;padding:16px;overflow:auto}.score{font-size:2rem;font-weight:700}
    @media(max-width:700px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <h1>LinkedIn Optimizer</h1>
  <p>Evidence-based profile analysis. No scraping. No fabricated claims. Nothing is published automatically.</p>
  <div class="grid">
    <section><label>Headline</label><textarea id="headline"></textarea><label>About</label><textarea id="about"></textarea></section>
    <section><label>Experience (one bullet per line)</label><textarea id="experience"></textarea><label>Skills (comma separated)</label><textarea id="skills"></textarea></section>
  </div>
  <label>Target role</label><input id="role" style="width:100%;padding:10px;box-sizing:border-box;margin:8px 0 16px" value="ML Engineer">
  <label>Job description</label><textarea id="description"></textarea>
  <button onclick="analyzeProfile()">Analyze</button>
  <div id="result"></div>
<script>
async function analyzeProfile(){
  const profile={headline:headline.value,about:about.value,experience:experience.value.split('\n').filter(Boolean),skills:skills.value.split(',').map(x=>x.trim()).filter(Boolean)};
  const res=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile,role:{title:role.value,description:description.value}})});
  const data=await res.json();
  result.innerHTML='<p class="score">Score: '+data.overall_score+'</p><pre>'+JSON.stringify(data,null,2)+'</pre>';
}
</script>
</body></html>
